name: Reservation grid UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'public/styles.css'
      - 'scripts/grid-ui-check.mjs'
      - '.github/workflows/grid-ui.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/grid-ui-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reservation-grid-layout-fixtures
          path: artifacts/grid-*.png
