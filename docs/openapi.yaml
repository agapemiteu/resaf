openapi: 3.1.0
info:
  title: Resaf reservation API
  version: 0.1.0
  description: Merchant policy, PayPal-backed commitment, reservation and settlement API. Includes buyer-approved final checkout, AI runs and verified purchase receipts.
servers:
  - url: https://resaf-api.onrender.com
security:
  - bearerAuth: []
components:
  securitySchemes:
    merchantAuth:
      type: http
      scheme: bearer
      description: Server-side merchant key. Buyer and agent keys cannot publish policies.
    bearerAuth:
      type: http
      scheme: bearer
      description: Demo key bound by the server to a seeded buyer identity.
  schemas:
    PolicyInput:
      type: object
      additionalProperties: false
      required: [commitment_amount, currency, payment_mode, hold_duration_seconds, approval_claim_seconds, max_active_holds_per_buyer, repeat_cooldown_seconds, purchase_refund_bps, release_refund_bps, expiry_refund_bps]
      properties:
        commitment_amount: { type: string, pattern: '^\d{1,8}\.\d{2}$', example: '2.00' }
        currency: { type: string, enum: [USD] }
        payment_mode: { type: string, enum: [AUTHORIZE, CAPTURE] }
        hold_duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
        approval_claim_seconds: { type: integer, minimum: 30, maximum: 300 }
        max_active_holds_per_buyer: { type: integer, minimum: 1, maximum: 10 }
        repeat_cooldown_seconds: { type: integer, minimum: 0, maximum: 604800 }
        purchase_refund_bps: { type: integer, minimum: 0, maximum: 10000 }
        release_refund_bps: { type: integer, minimum: 0, maximum: 10000 }
        expiry_refund_bps: { type: integer, minimum: 0, maximum: 10000 }
        effective_at: { type: string, format: date-time, description: Omit to apply immediately. Future dates schedule a policy change. }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    Claim:
      type: object
      properties:
        reservation_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_COMMITMENT] }
        claim_expires_at: { type: string, format: date-time }
        policy_version: { type: integer }
        commitment:
          type: object
          properties:
            amount: { type: string }
            currency: { type: string }
paths:
  /api/v1/resources/{id}/policy:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      security: []
      description: Discover the currently effective merchant policy without payment.
      responses:
        '200': { description: Current policy including its ID, version and settlement terms }
        '404': { description: Resource has no effective policy }
    post:
      security:
        - merchantAuth: []
      description: Publish an immutable policy version. Does not alter existing reservations.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyInput' }
      responses:
        '201': { description: Created policy or replay of the same idempotent request }
        '400': { description: Invalid policy terms }
        '401': { description: Merchant credentials required }
        '404': { description: Resource does not belong to merchant }
        '409': { description: Idempotency key reused with different terms }
  /health:
    get:
      security: []
      responses:
        '200': { description: Process is running }
  /api/v1/resources/{id}:
    get:
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Merchant resource }
        '404': { description: Resource not found }
  /api/v1/reservations:
    post:
      description: Request a short provisional claim. This is not an active reservation.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_id]
              properties:
                resource_id: { type: string }
      responses:
        '201':
          description: Approval claim created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '409': { description: Policy or inventory conflict }
  /api/v1/reservations/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Owned reservation status }
        '404': { description: Not found or not owned by buyer }
  /api/v1/reservations/{id}/events:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Ordered reservation events }
  /api/v1/reservations/{id}/release:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Claim released }
        '202': { description: Reservation ended; PayPal settlement still pending }
  /api/v1/reservations/{id}/commitment:
    post:
      description: Create a PayPal commitment order using the reservation's accepted AUTHORIZE or CAPTURE policy.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: PayPal approval URL returned }
        '409': { description: Claim expired or no longer eligible }
  /api/v1/reservations/{id}/confirm:
    post:
      description: Verify PayPal authorization or completed capture before activating the reservation.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: PayPal commitment verified and reservation activated }
        '409': { description: Approval missing or claim ended }

  /api/v1/reservations/{id}/receipt:
    get:
      description: Owned purchase confirmation, issued only after a completed purchase and a fresh matching PayPal capture verification. Sandbox confirmations do not grant physical access.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Verified payment receipt with separate commitment and confirmed refund totals }
        '404': { description: Reservation does not belong to this buyer }
        '409': { description: Purchase or payment is not verified }
